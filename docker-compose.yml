services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - ecommerce
  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:9090,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9090,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_BROKER_ID: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - ecommerce
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=user
      - POSTGRES_DB=ecommerce
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    hostname: db
    networks:
      - ecommerce
  gateway:
    build: ./gateway
    restart: always
    depends_on:
      - db
      - kafka
    hostname: gateway
    environment:
      KAFKA_HOST: kafka:9090
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - ecommerce
  order:
    build: ./order
    restart: always
    depends_on:
      - db
      - kafka
    environment:
      KAFKA_HOST: kafka:9090
    env_file:
      - .env
    networks:
      - ecommerce
  inventory:
    build: ./inventory
    restart: always
    depends_on:
      - db
      - kafka
    environment:
      KAFKA_HOST: kafka:9090
    env_file:
      - .env
    networks:
      - ecommerce
  payment:
    build: ./payment
    restart: always
    depends_on:
      - db
      - kafka
    environment:
      KAFKA_HOST: kafka:9090
    env_file:
      - .env
    networks:
      - ecommerce
  product:
    build: ./product
    restart: always
    depends_on:
      - db
      - kafka
    environment:
      KAFKA_HOST: kafka:9090
    env_file:
      - .env
    networks:
      - ecommerce
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: nest-pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=pgadmin4
    ports:
      - '5050:80'
    depends_on:
      - db
    networks:
      - ecommerce
networks:
  ecommerce:
    driver: bridge